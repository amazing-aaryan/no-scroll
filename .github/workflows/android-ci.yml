name: Android CI

on:
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 36 SDK extension
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36-ext19" "build-tools;36.0.0"

      - name: Verify target API
        run: grep -Eq 'targetSdk[[:space:]]+36' app/build.gradle

      - name: Run unit tests, lint, and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
